version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-bale_bot_db}
      POSTGRES_USER: ${DB_USER:-bale_bot_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bale_bot_user} -d ${DB_NAME:-bale_bot_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Django Admin Web Server ─────────────────────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    command: web
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
      - logs_data:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Bale Bot Process ────────────────────────────────────────────────────────
  bot:
    build: .
    restart: unless-stopped
    command: bot
    volumes:
      - .:/app
      - media_data:/app/media
      - logs_data:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

  # ── Nginx (optional, uncomment for production with HTTPS) ──────────────────
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - static_data:/app/staticfiles:ro
  #     - media_data:/app/media:ro
  #     - ./nginx/certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - web

volumes:
  postgres_data:
  media_data:
  static_data:
  logs_data:
